<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>J.A.R.V.I.S. 4.0</title>
    <meta name="description" content="J.A.R.V.I.S. 4.0 — Neural Interface">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Fullscreen Canvas — Orb + Particles -->
    <canvas id="orb-canvas"></canvas>

    <!-- Boot Overlay -->
    <div id="boot-overlay" class="boot-overlay">
        <div class="boot-text">
            <div class="boot-logo" id="boot-logo">J.A.R.V.I.S.</div>
            <div class="boot-version">v4.0 — NEURAL INTERFACE</div>
            <div class="boot-log" id="boot-log"></div>
        </div>
    </div>

    <!-- Clock (top right) -->
    <div class="header-clock" id="header-clock">00:00:00</div>

    <!-- Status Indicator (below orb) -->
    <div id="status-area" class="status-area hidden">
        <div class="status-indicator" id="status-dot"></div>
        <span class="status-text" id="status-text">INITIALIZING</span>
    </div>

    <!-- Footer Status Bar -->
    <footer id="hud-footer" class="hud-footer hidden">
        <div class="footer-item">
            <span class="footer-label">STATUS</span>
            <span class="footer-value" id="footer-status">BOOTING</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-item">
            <span class="footer-label">MODEL</span>
            <span class="footer-value" id="footer-model">—</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-item">
            <span class="footer-label">KEY</span>
            <span class="footer-value" id="footer-key">—</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-item">
            <span class="footer-label">AUTH</span>
            <span class="footer-value" id="footer-auth">—</span>
        </div>
        <div class="footer-divider"></div>
        <div class="footer-item system-log">
            <span class="footer-label">LOG</span>
            <span class="footer-value log-text" id="footer-log">Starting systems...</span>
        </div>
    </footer>

    <!-- Orb Threads — SVG overlay that connects modals to the orb nucleus -->
    <svg id="orb-threads" class="orb-threads-overlay" xmlns="http://www.w3.org/2000/svg"></svg>

    <!-- Search Cache Bubbles -->
    <div id="cache-bubbles-container" class="cache-bubbles-container"></div>

    <!-- Floating Action Button (FAB) & Menu -->
    <div id="fab-container" class="fab-container hidden">
        <button id="fab-main" class="fab-main" title="Configuraciones">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </button>
        <div id="fab-menu" class="fab-menu">
            <button class="fab-item" onclick="triggerAction('train_voice')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <span>Entrenar Voz</span>
            </button>
            <!-- Más opciones pueden ir aquí en el futuro -->
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container" class="modals-container">
        <!-- Los modales se inyectarán aquí dinámicamente -->
    </div>

    <!-- pywebview injects its bridge automatically -->
    <script src="app.js"></script>
</body>
</html>
